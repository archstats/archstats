name: Docs

# Builds the documentation site (VitePress, docs/.vitepress) on every push and
# pull request that touches it; a link to a page that does not exist fails the
# build like a test. On main, it then publishes to GitHub Pages:
# https://archstats.github.io/archstats/
on:
  push:
    branches: [main]
    paths: [docs/**, DESCRIPTION.md, CHANGELOG.md, .github/workflows/docs.yml]
  pull_request:
    branches: [main]
    paths: [docs/**, DESCRIPTION.md, CHANGELOG.md, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
