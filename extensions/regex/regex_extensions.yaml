extensions:

  scala:
    file_glob: "**/*.scala"
    patterns:
    - package (?P<modularity__component__declarations>[a-z0-9_.]*)
    - import (?P<modularity__component__imports>[a-z0-9_.]*)\.[A-Z]
    - ((abstract.*class)|trait).*(?P<modularity__types__abstract>\w+)
    - (class|trait).*(?P<modularity__types__total>\w+)
    - object (?P<modularity__types__total>\w+)

  kotlin:
    file_glob: "**/*.kt"
    patterns:
    - package (?P<modularity__component__declarations>.*)
    - import (?P<modularity__component__imports>.*)\.\w+\n
    - ((abstract.*class)|interface).*(?P<modularity__types__abstract>\w+)
    - (class|interface).*(?P<modularity__types__total>\w+)

  php:
    file_glob: "**/*.php"
    patterns:
    - namespace (?P<modularity__component__declarations>.*);
    - (use|import) (?P<modularity__component__imports>.*)\\.*;
    - (abstract class|interface|trait) (?P<modularity__types__abstract>\w+)
    - (class|interface|trait) (?P<modularity__types__total>\w+)

  # Go names a package by its last element only -- `package core` says
  # nothing about where it sits -- so there is deliberately no declarations
  # pattern here. Without one the engine resolves components by directory,
  # which is what an import path already points at.
  go:
    file_glob: "**/*.go"
    patterns:
    - (?m)^\s*(?:[A-Za-z_][A-Za-z0-9_]*\s+)?"(?P<modularity__component__imports>[a-zA-Z0-9_\-./]+)"\s*$
    - (?m)^type\s+(?P<modularity__types__abstract>[A-Za-z0-9_]+)\s+interface\b
    - (?m)^type\s+(?P<modularity__types__total>[A-Za-z0-9_]+)\s

  javascript:
    file_glob: "**/*.{js,jsx,mjs,cjs}"
    patterns:
    - (?:from|import)\s+["'](?P<modularity__component__imports>[^"']+)["']
    - class\s+(?P<modularity__types__total>[a-zA-Z0-9_]+)

  typescript:
    file_glob: "**/*.{ts,tsx,mts,cts}"
    patterns:
    - (?:from|import)\s+["'](?P<modularity__component__imports>[^"']+)["']
    - interface\s+(?P<modularity__types__abstract>[a-zA-Z0-9_]+)
    - abstract\s+class\s+(?P<modularity__types__abstract>[a-zA-Z0-9_]+)
    - (?:class|interface)\s+(?P<modularity__types__total>[a-zA-Z0-9_]+)

  python:
    file_glob: "**/*.py"
    patterns:
    - (?:import\s+|from\s+)(?P<modularity__component__imports>[a-zA-Z0-9_.]+)
    - class\s+(?P<modularity__types__total>[a-zA-Z0-9_]+)