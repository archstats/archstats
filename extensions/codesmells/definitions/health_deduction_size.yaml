id: codesmells__health__deduction__size
name: "Size deduction"
short_description: "Points taken off a file's health for its size: one per doubling of code lines past 150."
long_description: |
  300 code lines cost one point, 600 two, 1,200 three; nothing caps it. A file no pack parsed is measured by its non-blank lines past 180 instead. Bigger files collect more bug fixes, though not more per line, so this deduction is about how much there is to change rather than how well it is written. Recorded for files only.
category: "Code health"
