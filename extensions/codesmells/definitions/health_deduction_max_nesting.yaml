id: codesmells__health__deduction_max_nesting
name: Max-nesting deduction
short_description: Points taken off a file's health for its deepest nesting: 0.5 per level over the language's threshold, at most 3.
long_description: |
  One of the inputs behind a file's code health, stored so the score can be explained rather than taken on trust: health is 10 less the size, maximum-nesting and average-nesting deductions, and never below 1. Recorded for files only; a component's health is the size-weighted average of its files'.
category: "Code health"
